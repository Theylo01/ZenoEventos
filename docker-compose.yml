services:
  db:
    image: postgres:17
    container_name: zenodbcontainer
    restart: unless-stopped
    environment:
      POSTGRES_USER: zenouser
      POSTGRES_PASSWORD: zeno123
      POSTGRES_DB: zenodb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: